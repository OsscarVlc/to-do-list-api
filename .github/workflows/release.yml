name: Release

# Se dispara al empujar un tag con forma v#.#.# (ej. v1.0.0, v2.13.4)
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del tag
        uses: actions/checkout@v4

      - name: Instalar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # No publicamos una versión que no pase las pruebas
      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas unitarias
        run: npm test

      - name: Comprimir el repositorio en zip
        run: git archive --format=zip -o to-do-list-api-${{ github.ref_name }}.zip HEAD

      - name: Crear el release en GitHub
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "to-do-list-api-${{ github.ref_name }}.zip" \
            --title "${{ github.ref_name }}" \
            --generate-notes